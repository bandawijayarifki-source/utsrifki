<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="shrimpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgGrad2)"/>
  <!-- Ice cubes pattern -->
  <rect x="30" y="190" width="40" height="30" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="320" y="180" width="48" height="32" rx="4" fill="#ffffff" opacity="0.25"/>
  <!-- Shrimp graphic -->
  <g transform="translate(200, 130) scale(1.6)">
    <!-- Body curved -->
    <path d="M 45 -20 C 65 5 50 45 15 50 C -5 54 -25 45 -30 30 C -35 15 -20 5 0 5 C 18 5 28 -8 15 -18 C 5 -25 -10 -18 -15 -10" 
          fill="none" stroke="url(#shrimpGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Shell segments lines -->
    <circle cx="28" cy="18" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="16" cy="30" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="-2" cy="33" r="2" fill="#ffffff" opacity="0.6"/>
    <!-- Tail fans -->
    <polygon points="-30,30 -44,36 -40,24" fill="#ea580c"/>
    <polygon points="-30,32 -42,46 -33,42" fill="#c2410c"/>
    <!-- Head rostrum & antenna -->
    <polygon points="45,-20 60,-32 50,-14" fill="#f97316"/>
    <path d="M 52 -22 Q 80 -45 95 -40" stroke="#fed7aa" stroke-width="1.8" fill="none"/>
    <path d="M 54 -18 Q 85 -30 92 -20" stroke="#fed7aa" stroke-width="1.8" fill="none"/>
    <!-- Eye -->
    <circle cx="44" cy="-16" r="3" fill="#0f172a"/>
    <circle cx="43" cy="-17" r="1" fill="#ffffff"/>
  </g>
  <rect x="20" y="20" width="115" height="28" rx="14" fill="#f59e0b"/>
  <text x="77" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Kualitas Ekspor</text>
</svg>
