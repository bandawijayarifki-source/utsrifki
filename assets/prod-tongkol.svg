<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fishSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgGrad1)"/>
  <!-- Ice cubes pattern -->
  <rect x="20" y="180" width="40" height="30" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="70" y="195" width="45" height="35" rx="5" fill="#ffffff" opacity="0.25"/>
  <rect x="310" y="185" width="50" height="35" rx="5" fill="#ffffff" opacity="0.3"/>
  <rect x="250" y="200" width="45" height="30" rx="4" fill="#ffffff" opacity="0.2"/>
  <!-- Fish Torpedo Body (Tongkol) -->
  <g transform="translate(200, 130) rotate(-6)">
    <!-- Tail Fin -->
    <polygon points="120,0 160,-35 145,0 160,35" fill="#0f172a" />
    <polygon points="110,0 135,-20 125,0 135,20" fill="#334155" />
    <!-- Main Body -->
    <path d="M -150 0 C -110 -50 80 -45 125 0 C 80 45 -110 50 -150 0 Z" fill="url(#fishSilver)"/>
    <!-- Dark Back / Mackerel Patterns -->
    <path d="M -140 -2 C -105 -42 60 -38 120 -2 C 60 -18 -80 -20 -140 -2 Z" fill="#0f172a" opacity="0.85"/>
    <!-- Stripes on back -->
    <path d="M -80 -25 L -75 -10 M -60 -28 L -55 -12 M -40 -30 L -35 -14 M -20 -31 L -15 -14 M 0 -30 L 5 -15 M 20 -28 L 25 -14 M 40 -25 L 43 -12" 
          stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <!-- Dorsal Fins -->
    <polygon points="-50,-38 -30,-58 -10,-37" fill="#0f172a"/>
    <polygon points="10,-35 30,-48 50,-34" fill="#1e293b"/>
    <!-- Pectoral Fin -->
    <path d="M -80 5 C -60 5 -40 18 -55 24 C -75 24 -85 10 -80 5 Z" fill="#1e293b" opacity="0.9"/>
    <!-- Eye & Gill -->
    <circle cx="-120" cy="-6" r="8" fill="#ffffff"/>
    <circle cx="-121" cy="-6" r="4.5" fill="#090d16"/>
    <circle cx="-123" cy="-8" r="1.5" fill="#ffffff"/>
    <path d="M -95 -20 C -85 -10 -85 10 -95 20" stroke="#0f172a" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  <!-- Fresh Label Badge -->
  <rect x="20" y="20" width="125" height="28" rx="14" fill="#10b981"/>
  <text x="82" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Tangkapan Pagi</text>
</svg>
