<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kerapuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgGrad3)"/>
  <!-- Kerapu (Grouper) Fish with characteristic leopard spots -->
  <g transform="translate(200, 130)">
    <polygon points="110,0 150,-30 140,0 150,30" fill="#713f12" />
    <!-- Rounded stout body -->
    <path d="M -130 10 C -100 -50 60 -45 115 0 C 60 45 -100 45 -130 10 Z" fill="url(#kerapuGrad)"/>
    <!-- Spots -->
    <g fill="#713f12" opacity="0.8">
      <circle cx="-60" cy="-10" r="4"/><circle cx="-45" cy="-20" r="5"/><circle cx="-30" cy="-8" r="4.5"/>
      <circle cx="-15" cy="-22" r="5"/><circle cx="0" cy="-12" r="4"/><circle cx="15" cy="-24" r="5"/>
      <circle cx="30" cy="-10" r="4"/><circle cx="45" cy="-18" r="4.5"/><circle cx="60" cy="-5" r="4"/>
      <circle cx="-50" cy="10" r="4.5"/><circle cx="-30" cy="15" r="5"/><circle cx="-10" cy="8" r="4"/>
      <circle cx="10" cy="15" r="5"/><circle cx="35" cy="10" r="4.5"/><circle cx="55" cy="12" r="3.5"/>
    </g>
    <!-- Spiny dorsal fin -->
    <path d="M -70 -35 Q -30 -60 20 -40 Q 60 -55 90 -25" stroke="#713f12" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Eye & Mouth -->
    <circle cx="-105" cy="-5" r="9" fill="#fef08a"/>
    <circle cx="-105" cy="-5" r="5" fill="#0f172a"/>
    <path d="M -130 10 Q -115 20 -105 18" stroke="#713f12" stroke-width="4" fill="none"/>
  </g>
  <rect x="20" y="20" width="105" height="28" rx="14" fill="#0284c7"/>
  <text x="72" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Ikan Premium</text>
</svg>
