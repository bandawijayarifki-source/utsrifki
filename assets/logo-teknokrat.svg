<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <linearGradient id="utiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="utiFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="utiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="110" cy="110" r="102" fill="#ffffff" stroke="#991b1b" stroke-width="4" filter="url(#utiShadow)"/>
  
  <!-- Outer Ring with Red Maroon -->
  <circle cx="110" cy="110" r="95" fill="#991b1b" />
  <circle cx="110" cy="110" r="74" fill="#ffffff" stroke="#eab308" stroke-width="2" />

  <!-- Circular Text Path for TEKNOKRAT -->
  <path id="utiTextPathTop" d="M 32 110 A 78 78 0 0 1 188 110" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="2">
    <textPath href="#utiTextPathTop" startOffset="50%" text-anchor="middle">
      UNIVERSITAS TEKNOKRAT
    </textPath>
  </text>
  
  <path id="utiTextPathBottom" d="M 188 114 A 78 78 0 0 1 32 114" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#fef08a" letter-spacing="3.5">
    <textPath href="#utiTextPathBottom" startOffset="50%" text-anchor="middle">
      INDONESIA
    </textPath>
  </text>

  <!-- Stars on the sides -->
  <polygon points="26,110 28,113 32,113 29,115 30,118 26,116 22,118 23,115 20,113 24,113" fill="#eab308" />
  <polygon points="194,110 196,113 200,113 197,115 198,118 194,116 190,118 191,115 188,113 192,113" fill="#eab308" />

  <!-- Inner Pentagon / Shield (Yellow Gold) -->
  <polygon points="110,44 168,86 146,152 74,152 52,86" fill="url(#utiGold)" stroke="#1e3a8a" stroke-width="2.5" />
  <polygon points="110,50 162,88 142,146 78,146 58,88" fill="#ffffff" />

  <!-- Gear Wheels (Technology) -->
  <g fill="#1e3a8a" opacity="0.15">
    <circle cx="110" cy="108" r="34" stroke="#1e3a8a" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
  </g>

  <!-- Open Book (Ilmu Pengetahuan) -->
  <g transform="translate(110, 134)">
    <path d="M 0 -2 C -12 -8 -26 -6 -34 0 L -34 14 C -26 8 -12 6 0 12 C 12 6 26 8 34 14 L 34 0 C 26 -6 12 -8 0 -2 Z" 
          fill="#1e3a8a" stroke="#0f172a" stroke-width="1.2" />
    <path d="M -2 0 L -2 12" stroke="#ffffff" stroke-width="1.5" />
    <path d="M -28 3 C -20 -1 -10 1 -4 4" stroke="#ffffff" stroke-width="1" fill="none" />
    <path d="M -28 7 C -20 3 -10 5 -4 8" stroke="#ffffff" stroke-width="1" fill="none" />
    <path d="M 28 3 C 20 -1 10 1 4 4" stroke="#ffffff" stroke-width="1" fill="none" />
    <path d="M 28 7 C 20 3 10 5 4 8" stroke="#ffffff" stroke-width="1" fill="none" />
  </g>

  <!-- Torch / Obor (Pendidikan & Semangat Sang Juara) -->
  <g transform="translate(110, 102)">
    <!-- Torch handle & bowl -->
    <path d="M -7 18 L 7 18 L 10 2 L -10 2 Z" fill="#b45309" stroke="#78350f" stroke-width="1" />
    <ellipse cx="0" cy="2" rx="10" ry="3" fill="#fef08a" stroke="#78350f" stroke-width="1" />
    <rect x="-4" y="18" width="8" height="12" fill="#78350f" rx="1"/>
    <!-- Flames (Flames of excellence) -->
    <path d="M 0 0 C -12 -12 -14 -26 0 -42 C 4 -28 14 -24 6 -16 C 16 -24 20 -14 12 -4 C 8 -8 2 -8 0 0 Z" 
          fill="url(#utiFlame)" />
    <path d="M 0 -4 C -6 -12 -6 -20 0 -28 C 4 -20 8 -16 2 -10 C 8 -16 10 -8 4 0 Z" 
          fill="#fef08a" />
  </g>

  <!-- Laurel / Padi side branches -->
  <g fill="#15803d">
    <ellipse cx="68" cy="98" rx="2.5" ry="5" transform="rotate(-35 68 98)"/>
    <ellipse cx="66" cy="112" rx="2.5" ry="5" transform="rotate(-20 66 112)"/>
    <ellipse cx="68" cy="126" rx="2.5" ry="5" transform="rotate(10 68 126)"/>
    <ellipse cx="152" cy="98" rx="2.5" ry="5" transform="rotate(35 152 98)"/>
    <ellipse cx="154" cy="112" rx="2.5" ry="5" transform="rotate(20 154 112)"/>
    <ellipse cx="152" cy="126" rx="2.5" ry="5" transform="rotate(-10 152 126)"/>
  </g>
</svg>
