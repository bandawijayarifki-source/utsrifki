<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="420" fill="url(#skyGrad)"/>
  
  <!-- Mount Tanggamus in morning mist -->
  <polygon points="620,120 860,340 380,340" fill="#0369a1" opacity="0.45"/>
  <polygon points="560,160 760,340 360,340" fill="#0f766e" opacity="0.35"/>
  <polygon points="620,120 660,190 580,210" fill="#ffffff" opacity="0.4"/>
  
  <!-- Coastal hills -->
  <path d="M 0 350 Q 250 280 500 340 T 1000 320 T 1200 350 L 1200 420 L 0 420 Z" fill="#047857" opacity="0.75"/>
  <path d="M 0 370 Q 300 310 650 360 T 1200 360 L 1200 420 L 0 420 Z" fill="#065f46" opacity="0.9"/>

  <!-- Sea (Teluk Semaka) -->
  <rect y="400" width="1200" height="200" fill="url(#seaGrad)"/>
  
  <!-- Light reflections on waves -->
  <ellipse cx="600" cy="425" rx="280" ry="10" fill="#7dd3fc" opacity="0.35"/>
  <ellipse cx="500" cy="460" rx="420" ry="12" fill="#38bdf8" opacity="0.25"/>
  <ellipse cx="700" cy="510" rx="350" ry="15" fill="#bae6fd" opacity="0.2"/>

  <!-- Traditional fishing boats (Perahu Jukung Teluk Semaka) -->
  <!-- Boat 1 -->
  <g transform="translate(320, 440) scale(1.1)">
    <path d="M -50 0 Q 0 16 60 0 Q 40 18 0 18 Q -30 18 -50 0 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <rect x="-35" y="4" width="75" height="3" fill="#0284c7"/>
    <polygon points="5,-40 5,2 -30,0" fill="#ffffff" opacity="0.9"/>
    <polygon points="6,-38 6,2 35,0" fill="#ef4444" opacity="0.9"/>
    <!-- Cadik / outrigger float -->
    <path d="M -40 22 L 50 22" stroke="#eab308" stroke-width="3"/>
  </g>

  <!-- Distant Boat 2 -->
  <g transform="translate(850, 415) scale(0.65)" opacity="0.85">
    <path d="M -40 0 Q 0 12 50 0 Q 30 14 0 14 Q -20 14 -40 0 Z" fill="#ffffff"/>
    <polygon points="0,-35 0,2 -25,0" fill="#ffffff"/>
    <polygon points="1,-32 1,2 25,0" fill="#0284c7"/>
  </g>
</svg>
