<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Border -->
  <path d="M 20 25 Q 100 15 180 25 L 180 140 Q 180 205 100 230 Q 20 205 20 140 Z" 
        fill="#ffffff" stroke="#ca8a04" stroke-width="4" filter="url(#dropShadow)" />
  
  <!-- Inner Shield with Landscape Gradient -->
  <path d="M 26 31 Q 100 22 174 31 L 174 138 Q 174 198 100 222 Q 26 198 26 138 Z" 
        fill="url(#shieldGrad)" />

  <!-- Mount Tanggamus Silhouette -->
  <polygon points="100,55 145,115 55,115" fill="#14532d" />
  <polygon points="68,75 110,120 28,120" fill="#166534" />
  <polygon points="132,70 172,120 95,120" fill="#15803d" />

  <!-- Sea waves (Teluk Semaka) -->
  <path d="M 26 115 Q 60 105 100 115 T 174 115 L 174 140 Q 140 148 100 138 T 26 140 Z" fill="#38bdf8" opacity="0.6"/>
  <path d="M 26 130 Q 60 122 100 130 T 174 130 L 174 150 Q 140 158 100 148 T 26 150 Z" fill="#0284c7" />

  <!-- Traditional Lampung Siger Crown on Top -->
  <g transform="translate(100, 32) scale(0.68)">
    <path d="M -60 10 Q -40 -20 -30 0 Q -15 -35 0 -15 Q 15 -35 30 0 Q 40 -20 60 10 Q 0 18 -60 10 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="1.5" />
    <circle cx="0" cy="-7" r="4" fill="#dc2626" />
    <circle cx="-25" cy="2" r="3" fill="#dc2626" />
    <circle cx="25" cy="2" r="3" fill="#dc2626" />
  </g>

  <!-- Padi & Kapas Wreath -->
  <!-- Left: Padi (Golden grains) -->
  <g fill="#eab308" stroke="#a16207" stroke-width="0.7">
    <ellipse cx="45" cy="80" rx="3" ry="6" transform="rotate(-30 45 80)"/>
    <ellipse cx="40" cy="95" rx="3" ry="6" transform="rotate(-20 40 95)"/>
    <ellipse cx="38" cy="112" rx="3" ry="6" transform="rotate(-10 38 112)"/>
    <ellipse cx="40" cy="130" rx="3" ry="6" transform="rotate(10 40 130)"/>
    <ellipse cx="46" cy="148" rx="3" ry="6" transform="rotate(25 46 148)"/>
    <ellipse cx="58" cy="165" rx="3" ry="6" transform="rotate(45 58 165)"/>
  </g>
  <!-- Right: Kapas (White/Green buds) -->
  <g fill="#ffffff" stroke="#15803d" stroke-width="1">
    <circle cx="155" cy="80" r="4.5" />
    <circle cx="160" cy="98" r="4.5" />
    <circle cx="162" cy="116" r="4.5" />
    <circle cx="159" cy="134" r="4.5" />
    <circle cx="152" cy="151" r="4.5" />
    <circle cx="140" cy="166" r="4.5" />
  </g>

  <!-- Center Fishery / Traditional Sailing Boat & Fish Icon -->
  <g transform="translate(100, 142)">
    <!-- Traditional Perahu Nelayan -->
    <path d="M -24 6 Q 0 16 24 6 Q 16 14 0 14 Q -16 14 -24 6 Z" fill="#78350f" stroke="#fef08a" stroke-width="1"/>
    <polygon points="0,-16 0,5 -18,2" fill="#ffffff" opacity="0.95" />
    <polygon points="1,-14 1,5 14,3" fill="#f8fafc" opacity="0.9" />
    <!-- Fresh Fish silhouette jumping -->
    <path d="M -12 -5 Q -2 -14 10 -4 Q 18 -10 20 -2 Q 14 2 10 0 Q -2 4 -12 -5 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
  </g>

  <!-- Banner / Pita Motto Tanggamus: "BEGIWI JEJAMA" -->
  <g transform="translate(100, 192)">
    <path d="M -60 0 L 60 0 L 52 14 L 60 20 L -60 20 L -52 14 Z" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <text x="0" y="14" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" fill="#991b1b" letter-spacing="1">BEGIWI JEJAMA</text>
  </g>

  <!-- Header Text inside shield -->
  <text x="100" y="47" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">TANGGAMUS</text>
</svg>
