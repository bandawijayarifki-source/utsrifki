<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="squidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgGrad4)"/>
  <g transform="translate(180, 130) rotate(-15)">
    <!-- Squid Torpedo Mantle -->
    <path d="M -110 0 Q -30 -38 70 -30 L 70 30 Q -30 38 -110 0 Z" fill="url(#squidGrad)"/>
    <!-- Triangular Fins -->
    <polygon points="-110,0 -40,-45 -20,-30" fill="#a855f7"/>
    <polygon points="-110,0 -40,45 -20,30" fill="#a855f7"/>
    <!-- Eyes -->
    <circle cx="55" cy="-14" r="7" fill="#ffffff"/>
    <circle cx="56" cy="-14" r="3.5" fill="#0f172a"/>
    <circle cx="55" cy="14" r="7" fill="#ffffff"/>
    <circle cx="56" cy="14" r="3.5" fill="#0f172a"/>
    <!-- Tentacles -->
    <path d="M 70 -20 Q 110 -25 150 -15" stroke="#e879f9" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 70 -8 Q 120 -10 165 -2" stroke="#d946ef" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 70 6 Q 130 10 175 14" stroke="#c026d3" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M 70 18 Q 115 22 155 28" stroke="#e879f9" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="20" y="20" width="120" height="28" rx="14" fill="#a855f7"/>
  <text x="80" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Cumi Sero Segar</text>
</svg>
