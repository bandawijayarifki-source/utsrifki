<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="silverGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgGrad6)"/>
  <!-- Sleek slender Spanish Mackerel (Tenggiri) -->
  <g transform="translate(200, 130) rotate(-4)">
    <polygon points="130,0 170,-35 155,0 170,35" fill="#1e293b" />
    <!-- Slender body -->
    <path d="M -160 0 C -120 -35 90 -30 135 0 C 90 30 -120 35 -160 0 Z" fill="url(#silverGrad2)"/>
    <!-- Dark wavy bars on side -->
    <g stroke="#334155" stroke-width="2.5" opacity="0.7">
      <line x1="-70" y1="-15" x2="-65" y2="15"/>
      <line x1="-50" y1="-18" x2="-45" y2="18"/>
      <line x1="-30" y1="-20" x2="-25" y2="20"/>
      <line x1="-10" y1="-20" x2="-5" y2="20"/>
      <line x1="10" y1="-18" x2="15" y2="18"/>
      <line x1="30" y1="-16" x2="35" y2="16"/>
      <line x1="50" y1="-14" x2="55" y2="14"/>
    </g>
    <!-- Sharp beak head & eye -->
    <circle cx="-135" cy="-4" r="7" fill="#ffffff"/>
    <circle cx="-136" cy="-4" r="4" fill="#0f172a"/>
    <circle cx="-138" cy="-5" r="1.5" fill="#ffffff"/>
    <path d="M -160 0 L -130 5" stroke="#334155" stroke-width="2.5"/>
  </g>
  <rect x="20" y="20" width="130" height="28" rx="14" fill="#10b981"/>
  <text x="85" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Tenggiri Giling Murni</text>
</svg>
